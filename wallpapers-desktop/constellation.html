<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CBDOS - Constelacion Neon</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const PARTICLE_COUNT = 24;
const CONNECTION_DIST = 120;
const BG_COLOR = '#0a0d1a';

class Particle {
    constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        this.radius = 3 + Math.random() * 5;
        this.alpha = 0.4 + Math.random() * 0.4;
        this.pulseSpeed = 0.015 + Math.random() * 0.025;
        this.phase = Math.random() * Math.PI * 2;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.phase += this.pulseSpeed;

        if (this.x < 0 || this.x > W) this.vx *= -1;
        if (this.y < 0 || this.y > H) this.vy *= -1;

        this.x = Math.max(0, Math.min(W, this.x));
        this.y = Math.max(0, Math.min(H, this.y));
    }

    draw() {
        const pulse = Math.sin(this.phase) * 0.25 + 0.75;
        const r = this.radius * pulse;
        const isEven = particles.indexOf(this) % 2 === 0;
        const color = isEven ? [0, 245, 212] : [114, 9, 183];

        // Glow
        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 3);
        grad.addColorStop(0, `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${this.alpha * pulse * 0.5})`);
        grad.addColorStop(1, `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0)`);
        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 3, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Nucleo
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${this.alpha * pulse})`;
        ctx.fill();
    }
}

const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
}

let tick = 0;

function animate() {
    tick++;

    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, W, H);

    // Lineas de constelacion
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const distSq = dx * dx + dy * dy;
            if (distSq < CONNECTION_DIST * CONNECTION_DIST) {
                const dist = Math.sqrt(distSq);
                const alpha = (1 - dist / CONNECTION_DIST) * 0.35;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(76, 201, 240, ${alpha})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
    }

    // Particulas
    for (const p of particles) {
        p.update();
        p.draw();
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
